<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地圖片隨機播放器</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        /* 左側控制面板 */
        #sidebar {
            width: 300px;
            background-color: #1e1e1e;
            border-right: 1px solid #2d2d2d;
            display: flex;
            flex-direction: column;
            padding: 20px;
            transition: margin-left 0.3s ease, visibility 0.3s ease;
            z-index: 10;
        }
        
        /* 隱藏左側面板時的樣式 */
        body.sidebar-hidden #sidebar {
            margin-left: -300px;
            visibility: hidden;
        }
        
        h2 {
            font-size: 15px;
            margin-top: 0;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaaaaa;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 10px;
        }
        
        .instruction {
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 20px;
            background-color: #151515;
            padding: 12px;
            border-radius: 6px;
            border-left: 3px solid #ff9800;
        }
        
        .btn-wrapper {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        /* 按鈕樣式 */
        .btn {
            display: block;
            width: 100%;
            background-color: #333333;
            color: white;
            padding: 10px 15px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid #444;
            transition: all 0.2s;
            user-select: none;
        }
        .btn:hover {
            background-color: #444444;
            border-color: #555;
        }
        .btn-primary {
            background-color: #ff9800;
            border: none;
            color: #000;
        }
        .btn-primary:hover {
            background-color: #e68a00;
        }
        
        #file-input {
            display: none;
        }
        
        /* 圖片清單 */
        #file-list-container {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            background-color: #262626;
            margin-bottom: 6px;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid transparent;
            font-size: 12px;
            transition: all 0.2s;
        }
        .file-item:hover {
            background-color: #333;
        }
        .file-item.active {
            background-color: #2e1f0a;
            border-color: #ff9800;
            color: #ff9800;
        }
        .file-item .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        
        /* 右側圖片展示區 */
        #viewer {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a;
            position: relative;
            padding: 10px;
        }
        
        #main-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
            user-select: none;
        }
        
        #placeholder-text {
            color: #444;
            font-size: 16px;
            text-align: center;
            line-height: 1.8;
        }
        
        /* 控制與狀態UI */
        .toggle-sidebar-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(30, 30, 30, 0.8);
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            z-index: 20;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
        }
        .toggle-sidebar-btn:hover {
            background-color: rgba(50, 50, 50, 0.9);
        }
        
        #status-bar {
            position: absolute;
            bottom: 15px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            border: 1px solid #2d2d2d;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- 切換側邊欄按鈕 -->
    <button class="toggle-sidebar-btn" id="toggle-btn">顯示/隱藏側邊欄 (H)</button>

    <!-- 左側控制面板 -->
    <div id="sidebar">
        <h2>控制面板</h2>
        <div class="instruction">
            <strong>操作說明：</strong><br>
            1. 點擊下方按鈕載入 <code>./img/</code> 目錄。<br>
            2. 載入後預設會將順序<strong>隨機打亂</strong>。<br>
            3. 按下 <strong>「向下鍵 (↓)」</strong> 跳轉下一張。<br>
            4. 按下 <strong>「向上鍵 (↑)」</strong> 返回上一張。<br>
            5. 按下 <strong>「H 鍵」</strong> 可隱藏/顯示左側面板。
        </div>
        
        <div class="btn-wrapper">
            <!-- 使用 webkitdirectory 允許使用者一次選取整個資料夾 -->
            <label for="file-input" class="btn btn-primary">載入 ./img/ 資料夾</label>
            <input type="file" id="file-input" webkitdirectory directory multiple>
            
            <button class="btn" id="shuffle-btn">重新隨機打亂順序</button>
        </div>

        <h2>目前播放隨機順序</h2>
        <div id="file-list-container">
            <!-- 圖片清單 -->
        </div>
    </div>

    <!-- 右側圖片展示區 -->
    <div id="viewer">
        <div id="placeholder-text">
            請點擊左側按鈕並選擇您的 <strong>img</strong> 資料夾<br>
            <span style="font-size:12px; color:#666;">(由於瀏覽器安全機制，需要手動選取一次該目錄)</span>
        </div>
        <img id="main-image" src="" alt="當前圖片">
        <div id="status-bar" style="display: none;">
            <span id="img-name" style="margin-right: 15px; color: #aaa;"></span>
            <span id="current-index">0</span> / <span id="total-count">0</span>
        </div>
    </div>

    <script>
        let imageFiles = [];
        let currentIndex = -1;

        const fileInput = document.getElementById('file-input');
        const fileListContainer = document.getElementById('file-list-container');
        const mainImage = document.getElementById('main-image');
        const placeholderText = document.getElementById('placeholder-text');
        const statusBar = document.getElementById('status-bar');
        const currentIndexSpan = document.getElementById('current-index');
        const totalCountSpan = document.getElementById('total-count');
        const imgNameSpan = document.getElementById('img-name');
        const toggleBtn = document.getElementById('toggle-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');

        // 監聽資料夾選取
        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // 過濾圖片檔案
            imageFiles = files.filter(file => file.type.startsWith('image/'));

            if (imageFiles.length > 0) {
                placeholderText.style.display = 'none';
                statusBar.style.display = 'block';
                
                // 載入後自動隨機打亂順序
                shuffleArray(imageFiles);
                
                currentIndex = 0;
                renderList();
                displayImage(currentIndex);
            } else {
                alert('所選資料夾內沒有找到圖片檔案。');
            }
        });

        // 重新打亂按鈕
        shuffleBtn.addEventListener('click', () => {
            if (imageFiles.length === 0) return;
            shuffleArray(imageFiles);
            currentIndex = 0;
            renderList();
            displayImage(currentIndex);
        });

        // 側邊欄顯示/隱藏切換
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-hidden');
        }
        toggleBtn.addEventListener('click', toggleSidebar);

        // Fisher-Yates 隨機打亂演算法
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 渲染左側順序清單
        function renderList() {
            fileListContainer.innerHTML = '';
            totalCountSpan.textContent = imageFiles.length;

            imageFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = `file-item ${index === currentIndex ? 'active' : ''}`;
                item.innerHTML = `<div class="name">${index + 1}. ${file.name}</div>`;

                item.addEventListener('click', () => {
                    switchImage(index);
                });

                fileListContainer.appendChild(item);
            });
        }

        // 切換圖片
        function switchImage(index) {
            if (index < 0 || index >= imageFiles.length) return;
            currentIndex = index;
            
            const items = fileListContainer.querySelectorAll('.file-item');
            items.forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                } else {
                    item.classList.remove('active');
                }
            });

            displayImage(currentIndex);
        }

        // 渲染圖片到畫面上
        function displayImage(index) {
            if (index < 0 || index >= imageFiles.length) return;
            
            const file = imageFiles[index];
            const imageUrl = URL.createObjectURL(file);
            
            const oldUrl = mainImage.src;
            mainImage.src = imageUrl;
            mainImage.style.display = 'block';
            
            if (oldUrl && oldUrl.startsWith('blob:')) {
                URL.revokeObjectURL(oldUrl);
            }

            imgNameSpan.textContent = file.name;
            currentIndexSpan.textContent = index + 1;
        }

        // 鍵盤事件：向下鍵(下一張)、向上鍵(上一張)、H鍵(開關側邊欄)
        window.addEventListener('keydown', function(e) {
            // 處理 H 鍵切換側邊欄
            if (e.key === 'h' || e.key === 'H') {
                toggleSidebar();
                return;
            }

            if (imageFiles.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                let nextIndex = currentIndex + 1;
                if (nextIndex >= imageFiles.length) nextIndex = 0;
                switchImage(nextIndex);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                let prevIndex = currentIndex - 1;
                if (prevIndex < 0) prevIndex = imageFiles.length - 1;
                switchImage(prevIndex);
            }
        });
    </script>
</body>
</html>
