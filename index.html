<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全自動免填檔名隨機播放器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: #0a0a0a; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden;
        }
        #viewer {
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            padding: 10px; position: relative;
        }
        #main-image {
            max-width: 100%; max-height: 100%; object-fit: contain;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); user-select: none; display: none;
        }
        #status-bar {
            position: absolute; bottom: 20px; right: 20px; background-color: rgba(0, 0, 0, 0.85);
            padding: 8px 16px; border-radius: 20px; font-size: 13px; border: 1px solid #2d2d2d;
            pointer-events: none; letter-spacing: 0.5px; backdrop-filter: blur(5px);
        }
        #img-name { margin-right: 15px; color: #aaa; }
        #counter { color: #ff9800; font-weight: bold; }
        #loading { font-size: 18px; color: #888; }
    </style>
</head>
<body>

    <div id="viewer">
        <div id="loading">正在自動掃描 img 資料夾內的所有圖片...</div>
        <img id="main-image" src="" alt="圖片載入中...">
        <div id="status-bar" style="display: none;">
            <span id="img-name">載入中...</span>
            <span id="counter"><span id="current-index">0</span> / <span id="total-count">0</span></span>
        </div>
    </div>

    <script>
        const IMG_DIR = './img/';
        // 支援的圖片副檔名格式
        const validExtensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];
        
        let imageFiles = [];
        let currentIndex = 0;

        const mainImage = document.getElementById('main-image');
        const imgNameSpan = document.getElementById('img-name');
        const currentIndexSpan = document.getElementById('current-index');
        const totalCountSpan = document.getElementById('total-count');
        const loadingDiv = document.getElementById('loading');
        const statusBar = document.getElementById('status-bar');

        // Fisher-Yates 隨機打亂演算法
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // 顯示圖片
        function displayImage(index) {
            if (imageFiles.length === 0) return;
            const imgData = imageFiles[index];
            mainImage.src = imgData.url;
            imgNameSpan.textContent = imgData.name;
            currentIndexSpan.textContent = index + 1;
            totalCountSpan.textContent = imageFiles.length;
        }

        // 🔥 核心魔法：全自動抓取本地/GitHub Pages 資料夾內的檔案清單
        async function autoLoadImages() {
            try {
                // 發出請求讀取資料夾目錄網頁
                const response = await fetch(IMG_DIR);
                const text = await response.text();
                
                // 建立一個虛擬的 HTML 解析器來讀取網頁內容
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                
                // 找出所有的超連結 (<a> 標籤)
                const links = doc.querySelectorAll('a');
                const filenames = [];

                links.forEach(link => {
                    const href = link.getAttribute('href');
                    if (!href) return;
                    
                    // 解碼 URL（避免中文檔名變亂碼）並純化檔名
                    const decodedHref = decodeURIComponent(href);
                    const filename = decodedHref.split('/').pop();
                    
                    // 檢查副檔名是否為圖片
                    const ext = filename.split('.').pop().toLowerCase();
                    if (validExtensions.includes(ext) && !filenames.includes(filename)) {
                        filenames.push(filename);
                    }
                });

                // 將檔名轉換為專案所需的物件結構
                imageFiles = filenames.map(name => ({
                    name: name,
                    url: `${IMG_DIR}${name}`
                }));

                if (imageFiles.length > 0) {
                    loadingDiv.style.display = 'none';
                    mainImage.style.display = 'block';
                    statusBar.style.display = 'block';
                    
                    shuffleArray(imageFiles); // 自動隨機打亂
                    displayImage(currentIndex);
                } else {
                    loadingDiv.textContent = "❌ 找不到圖片！請確認 img 資料夾內是否有圖片，且已 push 到 GitHub。";
                }

            } catch (error) {
                console.error("讀取資料夾失敗:", error);
                loadingDiv.textContent = "❌ 無法自動讀取資料夾。請確保已部署至 GitHub Pages 上執行。";
            }
        }

        // 啟動自動載入
        autoLoadImages();

        // 鍵盤事件監聽
        window.addEventListener('keydown', function(e) {
            if (imageFiles.length === 0) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                currentIndex = (currentIndex + 1) % imageFiles.length;
                displayImage(currentIndex);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                currentIndex = (currentIndex - 1 + imageFiles.length) % imageFiles.length;
                displayImage(currentIndex);
            }
        });
    </script>
</body>
</html>
